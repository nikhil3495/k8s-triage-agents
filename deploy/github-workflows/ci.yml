name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check . --output-format github
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest + coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Offline eval on replay fixtures
        run: uv run python -m eval.run_eval --mode replay --model scripted --out eval/results/ci-offline.json
      - name: Coverage badge data
        if: github.ref == 'refs/heads/main'
        run: uv run python scripts/coverage_badge.py coverage.xml > coverage-badge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: |
            coverage.xml
            coverage-badge.json
            eval/results/ci-offline.*

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: k8s-triage-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
