# Read-only identity used by the investigation tools (LiveClusterClient).
# Note: no access to Secrets or ConfigMap *contents* - the tools only need to
# know that a referenced object is missing, which pod events already report.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-investigator
  namespace: triage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: triage-investigator-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, nodes, namespaces, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triage-investigator-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: triage-investigator-readonly
subjects:
  - kind: ServiceAccount
    name: triage-investigator
    namespace: triage-system
